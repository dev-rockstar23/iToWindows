workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # iToWindows Unlock — iOS IPA build
  #
  # Produces a signed .ipa using your Apple ID (no $99 developer account
  # needed for ad-hoc / development distribution).
  #
  # HOW TO USE:
  #   1. Go to https://codemagic.io and sign in with GitHub
  #   2. Connect the dev-rockstar23/iToWindows repo
  #   3. Add these environment variables in Codemagic UI → Environment Variables:
  #        APP_STORE_CONNECT_ISSUER_ID    (from App Store Connect API)
  #        APP_STORE_CONNECT_KEY_ID       (from App Store Connect API)
  #        APP_STORE_CONNECT_PRIVATE_KEY  (contents of your .p8 file)
  #        CERTIFICATE_PRIVATE_KEY        (your signing certificate private key)
  #   4. Click "Start new build" → select this workflow → done
  #   5. Download the .ipa from the Artifacts tab when build completes
  # ─────────────────────────────────────────────────────────────────────────

  ios-ipa-build:
    name: iToWindows Unlock — iOS IPA
    max_build_duration: 60  # minutes

    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development   # works with free Apple ID, no $99 needed
        bundle_identifier: com.dev-rockstar23.itowindows-unlock
      vars:
        XCODE_PROJECT:  "PCUnlockApp/iToWindowsUnlock.xcodeproj"
        XCODE_SCHEME:   "iToWindowsUnlock"
        BUNDLE_ID:      "com.dev-rockstar23.itowindows-unlock"
        APP_VERSION:    "1.0.0"
        BUILD_NUMBER:   $PROJECT_BUILD_NUMBER
      xcode: latest
      cocoapods: default

    scripts:
      # ── Step 1: Show build environment ──────────────────────────────────
      - name: Print environment info
        script: |
          echo "Xcode: $(xcodebuild -version)"
          echo "Swift: $(swift --version)"
          echo "macOS: $(sw_vers -productVersion)"

      # ── Step 2: Set build number ─────────────────────────────────────────
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
        working_directory: PCUnlockApp

      # ── Step 3: Resolve Swift package dependencies ───────────────────────
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project iToWindowsUnlock.xcodeproj \
            -scheme iToWindowsUnlock
        working_directory: PCUnlockApp

      # ── Step 4: Build and archive ────────────────────────────────────────
      - name: Build iOS app (archive)
        script: |
          xcodebuild \
            -project iToWindowsUnlock.xcodeproj \
            -scheme iToWindowsUnlock \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/iToWindowsUnlock.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            | xcpretty
        working_directory: PCUnlockApp

      # ── Step 5: Export .ipa ──────────────────────────────────────────────
      - name: Export IPA
        script: |
          # Write export options plist
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>$(DEVELOPMENT_TEAM)</string>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/iToWindowsUnlock.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | xcpretty

    # ── Artifacts: the .ipa is saved here ───────────────────────────────────
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/iToWindowsUnlock.xcarchive
      - /tmp/xcodebuild_logs/*.log

    # ── Email notification when build completes ──────────────────────────────
    publishing:
      email:
        recipients:
          - dev-rockstar23@users.noreply.github.com   # replace with your real email
        notify:
          success: true
          failure: true
